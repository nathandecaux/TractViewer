# Desktop builds (Windows installer, macOS .dmg, Linux AppImage) and GitHub releases.
#
#   git push                      -> tests only (fix / regular commit: nothing is published)
#   git push origin vX.Y.Z        -> tests + builds + GitHub release vX.Y.Z
#                                    (packaging/release.sh patch|minor|major does bump + tag + push)
#   Actions > Desktop > Run workflow
#       release = none            -> test builds, downloadable from the run page (no release)
#       release = patch|minor|major -> bump the version, commit, tag, build and publish the release
#
# Tags with a suffix (v1.2.0-rc1) are published as pre-releases: the auto-updater ignores them.
name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "*.gif", "*.png"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (bumps the version) or only build test packages"
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxrender1 xvfb ffmpeg
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Tests
        run: xvfb-run -a python -m pytest -q tests

  # ------------------------------------------------------------------
  # Decides whether this run publishes a release, and bumps the version when asked.
  prepare:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the version bump commit and tag
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          BUMP: ${{ inputs.release }}
        run: |
          set -euo pipefail
          current=$(python3 packaging/bump_version.py)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            version=${tag#v}
            if [[ "${version%%-*}" != "$current" ]]; then
              echo "::error::Tag $tag does not match tractviewer/_version.py ($current). Use packaging/release.sh."
              exit 1
            fi
            release=true; ref=$tag
          elif [[ "${BUMP:-none}" != "none" ]]; then
            version=$(python3 packaging/bump_version.py "$BUMP")
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::Tag v$version already exists"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$version"
            git tag -a "v$version" -m "TractViewer $version"
            git push origin "HEAD:$GITHUB_REF_NAME" "v$version"
            release=true; ref="v$version"
          else
            version="$current-dev.${GITHUB_SHA::7}"
            release=false; ref=$GITHUB_SHA
          fi
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "### TractViewer $version (release: $release)" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-x64,   os: windows-latest }
          - { id: macos-arm64,   os: macos-15 }
          - { id: macos-x86_64,  os: macos-15-intel }
          - { id: linux-x86_64,  os: ubuntu-22.04 }   # oldest glibc = widest compatibility
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      NAME: TractViewer-${{ needs.prepare.outputs.version }}-${{ matrix.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxrender1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libnss3 libfuse2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6.10" pillow
          python -m pip uninstall -y tractviewer   # PyInstaller uses the checkout (pathex)

      - name: Bundle JS libraries and icon
        run: |
          python packaging/fetch_vendor.py
          python -c "from PIL import Image; Image.open('packaging/icon.png').save('packaging/build/icon.ico', sizes=[(s, s) for s in (16, 24, 32, 48, 64, 128, 256)])"

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/tractviewer.spec

      - name: Smoke test
        run: |
          case "$RUNNER_OS" in
            macOS)   exe=dist/TractViewer.app/Contents/MacOS/TractViewer ;;
            Windows) exe=dist/TractViewer/TractViewer.exe ;;
            *)       exe=dist/TractViewer/TractViewer ;;
          esac
          # GNU timeout is missing on macOS: perl alarm works on the three runners.
          run() { local t=$1; shift; perl -e 'alarm shift; exec @ARGV' "$t" "$@"; }
          run 120 "$exe" --version
          # The page of the interface must build (template, serialization): same code as the window.
          python -c "import pyvista as pv; pv.Sphere().save('smoke.vtk')"
          run 300 "$exe" html smoke.vtk -o smoke.html
          grep -q "smoke" smoke.html && echo "interface page OK ($(wc -c < smoke.html) bytes)"

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc /DAppVersion=$env:VERSION /DSourceDir=$PWD\dist\TractViewer /DOutputDir=$PWD\dist packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe | Select-Object Name, Length

      - name: Package (macOS .dmg + .zip)
        if: runner.os == 'macOS'
        run: packaging/macos/build_dmg.sh dist/TractViewer.app "dist/$NAME"

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: packaging/linux/build_appimage.sh dist/TractViewer "dist/$NAME.AppImage"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.NAME }}
          path: |
            dist/TractViewer-*.exe
            dist/TractViewer-*.dmg
            dist/TractViewer-*.zip
            dist/TractViewer-*.AppImage
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.release == 'true' && 5 || 14 }}
          compression-level: 0

  # ------------------------------------------------------------------
  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.ref }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          cd dist
          sha256sum TractViewer-* > SHA256SUMS.txt
          flags=(--generate-notes --title "TractViewer ${TAG#v}")
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" TractViewer-* SHA256SUMS.txt
