[project]
name = "tractviewer"
dynamic = ["version"]
description = "Tractography, surface and NIfTI viewer: vtk.js web interface and headless pyvista rendering"
authors = [ { name = "Anonymous" } ]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyvista",
  "numpy",
  "nibabel",
  "imageio",
  "imageio-ffmpeg; platform_system != 'Windows'",
  "matplotlib",
  "meshio",
  "tqdm",  # progress bars of pyvista readers
  # desktop mode; on Linux pywebview ships no GUI backend -> Qt WebEngine wheels (PyQt6)
  "pywebview>=5; sys_platform != 'linux'",
  "pywebview[qt]>=5; sys_platform == 'linux'",
]

[project.optional-dependencies]
offscreen = [
  # Installation hors-écran (nécessite index supplémentaire Kitware)
  # Commande suggérée: pip install vtk-osmesa --extra-index-url https://gitlab.kitware.com/api/v4/projects/13/packages/pypi/simple
  "vtk-osmesa"
]

[project.scripts]
tractviewer = "tractviewer.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "tractviewer._version.__version__" }

[tool.setuptools.packages.find]
include = ["tractviewer*"]

[tool.setuptools.package-data]
"tractviewer.web" = ["*.html"]
